name: bakeflow

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bakeflow}
      POSTGRES_USER: ${POSTGRES_USER:-bakeflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [bakeflow-network]

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6479}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [bakeflow-network]

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bakeflow}
      POSTGRES_USER: ${POSTGRES_USER:-bakeflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OPEN_FOOD_FACTS_BASE_URL: ${OPEN_FOOD_FACTS_BASE_URL:-https://world.openfoodfacts.org}
      OPEN_FOOD_FACTS_CACHE_TTL: ${OPEN_FOOD_FACTS_CACHE_TTL:-24h}
      BRASIL_API_BASE_URL: ${BRASIL_API_BASE_URL:-https://brasilapi.com.br}
      BRASIL_API_CACHE_TTL: ${BRASIL_API_CACHE_TTL:-12h}
      EXTERNAL_CACHE_STALE_TTL: ${EXTERNAL_CACHE_STALE_TTL:-7d}
      EXTERNAL_API_RATE_LIMIT: ${EXTERNAL_API_RATE_LIMIT:-30}
      EXTERNAL_API_RATE_WINDOW: ${EXTERNAL_API_RATE_WINDOW:-1m}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?configure JWT_SECRET_KEY with at least 32 random characters}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-15m}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-30d}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4300}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@bakeflow.local}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-}
    ports:
      - "${BACKEND_PORT:-8090}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [bakeflow-network]

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-4300}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [bakeflow-network]

  pgadmin:
    image: dpage/pgadmin4:9
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@bakeflow.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-change-me}
    ports:
      - "${PGADMIN_PORT:-5060}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks: [bakeflow-network]

volumes:
  postgres-data:
  redis-data:
  pgadmin-data:

networks:
  bakeflow-network:
    driver: bridge
