spring:
  application:
    name: bakeflow-backend
  profiles:
    default: dev
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/bakeflow}
    username: ${POSTGRES_USER:bakeflow}
    password: ${POSTGRES_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      repositories:
        enabled: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

server:
  shutdown: graceful

open-food-facts:
  base-url: ${OPEN_FOOD_FACTS_BASE_URL:https://world.openfoodfacts.org}
  connect-timeout: ${OPEN_FOOD_FACTS_CONNECT_TIMEOUT:2s}
  read-timeout: ${OPEN_FOOD_FACTS_READ_TIMEOUT:4s}
  cache-ttl: ${OPEN_FOOD_FACTS_CACHE_TTL:24h}
brasil-api:
  base-url: ${BRASIL_API_BASE_URL:https://brasilapi.com.br}
  connect-timeout: ${BRASIL_API_CONNECT_TIMEOUT:2s}
  read-timeout: ${BRASIL_API_READ_TIMEOUT:4s}
  cache-ttl: ${BRASIL_API_CACHE_TTL:12h}
integrations:
  stale-ttl: ${EXTERNAL_CACHE_STALE_TTL:7d}
  retry-attempts: ${EXTERNAL_API_RETRY_ATTEMPTS:2}
  circuit-failure-threshold: ${EXTERNAL_API_CIRCUIT_FAILURE_THRESHOLD:3}
  circuit-open-duration: ${EXTERNAL_API_CIRCUIT_OPEN_DURATION:30s}
  rate-limit: ${EXTERNAL_API_RATE_LIMIT:30}
  rate-window: ${EXTERNAL_API_RATE_WINDOW:1m}
security:
  jwt-secret: ${JWT_SECRET_KEY}
  access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
  refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:30d}
  cookie-secure: ${AUTH_COOKIE_SECURE:false}
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4300}
  login-rate-limit: ${LOGIN_RATE_LIMIT:10}
  demo-admin-email: ${DEMO_ADMIN_EMAIL:admin@bakeflow.local}
  demo-admin-password: ${DEMO_ADMIN_PASSWORD:}
