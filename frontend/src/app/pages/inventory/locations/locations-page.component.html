<app-page-header
  [eyebrow]="'inventory.physicalStructure' | translate"
  [title]="'locations.title' | translate"
  [description]="'locations.subtitle' | translate"
>
  @if (auth.can('ITEM_WRITE')) {
    <p-button [label]="'locations.create' | translate" icon="pi pi-plus" (onClick)="open()" />
  }
</app-page-header>
<form class="location-filters" [formGroup]="filters" (ngSubmit)="applyFilters()">
  <app-filter-panel>
    <div class="field">
      <label for="location-search">{{ 'common.name' | translate }}</label
      ><input pInputText id="location-search" formControlName="search" />
    </div>
    <div class="field">
      <label for="location-type">{{ 'common.type' | translate }}</label
      ><p-select
        inputId="location-type"
        formControlName="type"
        [options]="types()"
        optionLabel="label"
        optionValue="value"
        [showClear]="true"
      />
    </div>
    <div class="field">
      <label for="location-status">{{ 'common.status' | translate }}</label
      ><p-select
        inputId="location-status"
        formControlName="active"
        [options]="statuses()"
        optionLabel="label"
        optionValue="value"
        [showClear]="true"
      />
    </div>
    <div filterActions class="filter-actions">
      <p-button
        type="button"
        [label]="'common.clear' | translate"
        severity="secondary"
        [outlined]="true"
        (onClick)="clearFilters()"
      /><p-button type="submit" [label]="'common.filter' | translate" icon="pi pi-filter" />
    </div>
  </app-filter-panel>
</form>
@if (loading()) {
  <app-section-card><app-loading-state [label]="'common.loading' | translate" /></app-section-card>
} @else if (nodes().length === 0) {
  <app-section-card
    ><app-empty-state
      icon="pi-sitemap"
      [title]="(hasLocations() ? 'locations.noResultsTitle' : 'locations.emptyTitle') | translate"
      [description]="
        (hasLocations() ? 'locations.noResultsDescription' : 'locations.emptyDescription')
          | translate
      "
    >
      @if (!hasLocations() && auth.can('ITEM_WRITE')) {
        <p-button [label]="'locations.create' | translate" icon="pi pi-plus" (onClick)="open()" />
      }</app-empty-state
  ></app-section-card>
} @else {
  <div class="location-workspace">
    <app-section-card
      [title]="'locations.structure' | translate"
      [description]="'locations.structureHint' | translate"
    >
      <p-tree
        [value]="nodes()"
        selectionMode="single"
        [selection]="selectedNode()"
        (onNodeSelect)="selectNode($event)"
      >
        <ng-template #default let-node
          ><div class="location-node">
            <span class="node-identity"
              ><strong>{{ node.label }}</strong
              ><small>{{ label(node.data.type) }} · {{ node.data.code }}</small></span
            ><app-status-badge
              [label]="(node.data.active ? 'common.active' : 'common.inactive') | translate"
              [tone]="node.data.active ? 'success' : 'secondary'"
            /></div
        ></ng-template>
      </p-tree>
    </app-section-card>
    @if (selectedLocation(); as selected) {
      <app-location-details-panel
        [location]="selected"
        [parentName]="selectedParentName()"
        [hierarchyPath]="selectedPath()"
        [typeLabel]="label(selected.type)"
        [canManage]="auth.can('ITEM_WRITE')"
        (edit)="open(selected)"
        (addChild)="open(undefined, selected)"
        (toggleActive)="toggle(selected)"
      />
    } @else {
      <app-section-card [title]="'locations.details' | translate"
        ><app-empty-state
          icon="pi-map-marker"
          [title]="'locations.selectTitle' | translate"
          [description]="'locations.selectDescription' | translate"
      /></app-section-card>
    }
  </div>
}
<p-dialog
  [header]="(editing() ? 'locations.edit' : 'locations.create') | translate"
  [visible]="dialog()"
  (visibleChange)="dialog.set($event)"
  [modal]="true"
  [style]="{ width: '38rem', maxWidth: 'calc(100vw - 2rem)' }"
>
  <form [formGroup]="form" (ngSubmit)="save()">
    <div class="form-grid">
      <div class="field wide">
        <label for="location-name">{{ 'common.name' | translate }} *</label
        ><input pInputText id="location-name" formControlName="name" />
      </div>
      <div class="field">
        <label for="location-code">{{ 'common.code' | translate }} *</label
        ><input pInputText id="location-code" formControlName="code" />
      </div>
      <div class="field">
        <label for="form-location-type">{{ 'common.type' | translate }} *</label
        ><p-select
          inputId="form-location-type"
          formControlName="type"
          [options]="types()"
          optionLabel="label"
          optionValue="value"
        />
      </div>
      <div class="field wide">
        <label for="location-parent">{{ 'locations.parent' | translate }}</label
        ><p-select
          inputId="location-parent"
          formControlName="parentId"
          [options]="allLocations()"
          optionLabel="name"
          optionValue="id"
          [showClear]="true"
          [filter]="true"
        />
      </div>
    </div>
    <div class="dialog-actions">
      <p-button
        type="button"
        [label]="'common.cancel' | translate"
        severity="secondary"
        [outlined]="true"
        (onClick)="dialog.set(false)"
      /><p-button
        type="submit"
        [label]="'common.save' | translate"
        icon="pi pi-check"
        [loading]="submitting()"
        [disabled]="form.invalid || submitting()"
      />
    </div>
  </form>
</p-dialog>
