<app-page-header [eyebrow]="'inventory.physicalStructure'|translate" [title]="'locations.title'|translate" [description]="'locations.subtitle'|translate">
  @if(auth.can('ITEM_WRITE')){<p-button [label]="'locations.create' | translate" icon="pi pi-plus" (onClick)="open()" />}
</app-page-header>
<form class="filter-panel location-filters" [formGroup]="filters" (ngSubmit)="applyFilters()">
  <div class="field">
    <label for="location-search">{{ 'common.name' | translate }}</label
    ><input pInputText id="location-search" formControlName="search" />
  </div>
  <div class="field">
    <label for="location-type">{{ 'common.type' | translate }}</label
    ><p-select
      inputId="location-type"
      formControlName="type"
      [options]="types()"
      optionLabel="label"
      optionValue="value"
      [showClear]="true"
    />
  </div>
  <div class="field">
    <label for="location-status">{{ 'common.status' | translate }}</label
    ><p-select
      inputId="location-status"
      formControlName="active"
      [options]="statuses()"
      optionLabel="label"
      optionValue="value"
      [showClear]="true"
    />
  </div>
  <div class="actions">
    <p-button
      type="button"
      [label]="'common.clear' | translate"
      severity="secondary"
      [outlined]="true"
      (onClick)="clearFilters()"
    /><p-button type="submit" [label]="'common.filter' | translate" icon="pi pi-filter" />
  </div>
</form>
<section class="card tree-card">
  <div class="tree-title">
    <i class="pi pi-sitemap"></i><strong>{{ 'locations.structure' | translate }}</strong>
  </div>
  @if (!loading() && nodes().length === 0) {
    <div class="empty">
      <p>{{ 'locations.empty' | translate }}</p>
      @if(auth.can('ITEM_WRITE')){<p-button [label]="'locations.create' | translate" [text]="true" (onClick)="open()" />}
    </div>
  } @else {
    <p-tree [value]="nodes()" [loading]="loading()"
      ><ng-template #default let-node
        ><div class="location-node">
          <span>{{ node.label }}</span
          ><small>{{ label(node.data.type) }} · {{ node.data.code }}</small
          ><p-tag
            [value]="(node.data.active ? 'common.active' : 'common.inactive') | translate"
            [severity]="node.data.active ? 'success' : 'secondary'"
          />
          @if(auth.can('ITEM_WRITE')){<div class="node-actions">
            <p-button
              icon="pi pi-pencil"
              [rounded]="true"
              [text]="true"
              severity="secondary"
              [pTooltip]="'locations.viewOrEdit' | translate"
              [attr.aria-label]="('common.edit' | translate) + ' ' + node.label"
              (onClick)="open(node.data)"
            /><p-button
              icon="pi pi-plus"
              [rounded]="true"
              [text]="true"
              severity="secondary"
              [pTooltip]="'locations.addChild' | translate"
              [attr.aria-label]="('locations.addChild' | translate) + ' ' + node.label"
              (onClick)="open(undefined, node.data)"
            /><p-button
              [icon]="node.data.active ? 'pi pi-ban' : 'pi pi-check'"
              [rounded]="true"
              [text]="true"
              [severity]="node.data.active ? 'danger' : 'success'"
              [pTooltip]="(node.data.active ? 'common.deactivate' : 'common.activate') | translate"
              [attr.aria-label]="
                ((node.data.active ? 'common.deactivate' : 'common.activate') | translate) +
                ' ' +
                node.label
              "
              (onClick)="toggle(node.data)"
            />
          </div>}</div></ng-template
    ></p-tree>
  }
</section>
<p-dialog
  [header]="(editing() ? 'locations.edit' : 'locations.create') | translate"
  [visible]="dialog()"
  (visibleChange)="dialog.set($event)"
  [modal]="true"
  [style]="{ width: '38rem' }"
  ><form [formGroup]="form" (ngSubmit)="save()">
    <div class="form-grid">
      <div class="field wide">
        <label for="location-name">{{ 'common.name' | translate }} *</label
        ><input pInputText id="location-name" formControlName="name" />
      </div>
      <div class="field">
        <label for="location-code">{{ 'common.code' | translate }} *</label
        ><input pInputText id="location-code" formControlName="code" />
      </div>
      <div class="field">
        <label for="form-location-type">{{ 'common.type' | translate }} *</label
        ><p-select
          inputId="form-location-type"
          formControlName="type"
          [options]="types()"
          optionLabel="label"
          optionValue="value"
        />
      </div>
      <div class="field wide">
        <label for="location-parent">{{ 'locations.parent' | translate }}</label
        ><p-select
          inputId="location-parent"
          formControlName="parentId"
          [options]="allLocations()"
          optionLabel="name"
          optionValue="id"
          [showClear]="true"
          [filter]="true"
        />
      </div>
    </div>
    <div class="dialog-actions">
      <p-button
        type="button"
        [label]="'common.cancel' | translate"
        severity="secondary"
        [outlined]="true"
        (onClick)="dialog.set(false)"
      /><p-button
        type="submit"
        [label]="'common.save' | translate"
        icon="pi pi-check"
        [loading]="submitting()"
        [disabled]="form.invalid || submitting()"
      />
    </div></form
></p-dialog>
