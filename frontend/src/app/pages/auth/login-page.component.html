<main class="login">
  <form (ngSubmit)="submit()">
    <div class="brand"><span aria-hidden="true">B</span>BakeFlow</div>
    <div class="login-heading">
      <span class="eyebrow">BakeFlow</span>
      <h1>{{ 'auth.signIn' | translate }}</h1>
      <p>{{ 'auth.welcome' | translate }}</p>
    </div>
    <div class="field">
      <label for="email">{{ 'auth.email' | translate }}</label>
      <input
        id="email"
        pInputText
        name="email"
        type="email"
        autocomplete="username"
        [(ngModel)]="email"
        required
      />
    </div>
    <div class="field">
      <label for="password">{{ 'auth.password' | translate }}</label>
      <p-password
        inputId="password"
        name="password"
        [(ngModel)]="password"
        autocomplete="current-password"
        [feedback]="false"
        [toggleMask]="true"
        [minlength]="8"
        [maxlength]="128"
        required
      />
      <p class="helper">{{ 'auth.passwordPolicy' | translate }}</p>
    </div>
    @if (error()) {
      <p class="error" role="alert">{{ error() | translate }}</p>
    }
    <p-button
      type="submit"
      [label]="'auth.signIn' | translate"
      [loading]="loading()"
      [disabled]="!email || password.length < 8"
    />
  </form>
</main>
