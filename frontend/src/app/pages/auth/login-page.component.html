<main class="login"><form (ngSubmit)="submit()"><div class="brand"><span>B</span>BakeFlow</div><h1>{{'auth.signIn'|translate}}</h1><p>{{'auth.welcome'|translate}}</p><label for="email">{{'auth.email'|translate}}</label><input id="email" name="email" type="email" autocomplete="username" [(ngModel)]="email" required><label for="password">{{'auth.password'|translate}}</label><div class="password"><input id="password" name="password" [type]="show?'text':'password'" autocomplete="current-password" [(ngModel)]="password" minlength="8" maxlength="128" required><button type="button" (click)="show=!show" [attr.aria-label]="(show?'auth.hidePassword':'auth.showPassword')|translate"><i [class]="show?'pi pi-eye-slash':'pi pi-eye'"></i></button></div>@if(error()){<p class="error">{{error()|translate}}</p>}<p-button type="submit" [label]="'auth.signIn'|translate" [loading]="loading()" [disabled]="!email||password.length<8"/></form></main>
