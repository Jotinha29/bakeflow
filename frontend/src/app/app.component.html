<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/" aria-label="BakeFlow home">
      <span class="brand-mark">B</span>
      <span>BakeFlow</span>
    </a>
    <nav aria-label="Main navigation">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <i class="pi pi-home" aria-hidden="true"></i>
        Dashboard
      </a>
      <span class="nav-section">Inventory</span>
      <a routerLink="/inventory/items" routerLinkActive="active"><i class="pi pi-box" aria-hidden="true"></i>Items</a>
      <a routerLink="/inventory/batches" routerLinkActive="active"><i class="pi pi-tags" aria-hidden="true"></i>Batches</a>
      <a routerLink="/inventory/locations" routerLinkActive="active"><i class="pi pi-sitemap" aria-hidden="true"></i>Locations</a>
    </nav>
  </aside>

  <div class="content">
    <header>
      <span class="eyebrow">Production workspace</span>
      <span class="environment"><span></span> Foundation</span>
    </header>
    <main><router-outlet /></main>
  </div>
</div>
<p-toast position="bottom-right" />
<p-confirmdialog />
